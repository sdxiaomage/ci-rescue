name: CI repair request / CI 修复工单
description: Free diagnosis for one failing CI workflow / 单一 CI 故障免费诊断
title: "[Repair] "
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        The first diagnosis is free. A focused repair is US$39, async text only, payment after acceptance, with one consolidated revision. Do not post tokens, passwords, private source code, or personal data.

        首次诊断免费。边界明确的单一修复固定价 US$39，全程异步文字，验收后付款，最多一次合并反馈。不要发布密钥、密码、私有源码或个人信息。
  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Public repository preferred. For private repositories, describe the failure without sharing source or secrets.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Failing run or log URL
      placeholder: https://github.com/owner/repository/actions/runs/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the job do, and what changed before it failed?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you already tried
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets and personal/private data from the links and text above.
          required: true
        - label: I understand that any paid work requires a written scope and price before coding begins.
          required: true
        - label: I accept async text only and at most one consolidated revision within the agreed scope.
          required: true
