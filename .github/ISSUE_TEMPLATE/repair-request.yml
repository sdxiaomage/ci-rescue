name: CI repair request / CI 修复工单
description: Free diagnosis for one failing CI workflow / 单一 CI 故障免费诊断
title: "[Repair] "
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        The first diagnosis is free. A focused repair is US$39 internationally or CNY ¥299 for mainland-China Alipay payment, async text only, payment after acceptance, with one consolidated revision. Do not post tokens, passwords, private source code, or personal data.

        首次诊断免费。边界明确的单一修复大陆固定价 ¥299（支付宝）/ 国际固定价 US$39，全程异步文字，验收后付款，最多一次合并反馈。不要发布密钥、密码、私有源码或个人信息。
  - type: dropdown
    id: request_type
    attributes:
      label: Request type / 工单类型
      options:
        - Free diagnosis only / 仅免费诊断
        - CI-S1 fixed package (US$39 international / CNY ¥299 mainland) / CI-S1 固定套餐
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Preferred written language / 文字语言
      options:
        - English
        - 中文
    validations:
      required: true
  - type: dropdown
    id: public_repository
    attributes:
      label: Is the repository public? / 仓库是否公开
      options:
        - Yes / 是
        - No — I will provide only a sanitized minimal reproduction / 否，仅提供脱敏最小复现
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Required for a public-repository repair. Leave blank for a private repository and provide only a sanitized minimal reproduction below.
      placeholder: https://github.com/owner/repository
  - type: input
    id: run
    attributes:
      label: Failing run or log URL
      description: Use a public URL only. Leave blank if it would expose private data.
      placeholder: https://github.com/owner/repository/actions/runs/...
  - type: textarea
    id: sanitized_error
    attributes:
      label: Sanitized failure or minimal reproduction / 脱敏错误或最小复现
      description: Include the exact error and the smallest relevant workflow excerpt. Remove credentials, private source, and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the job do, and what changed before it failed?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you already tried
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance test / 验收测试
      description: State the job or written substitute test that must pass for the repair to be accepted.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets and personal/private data from the links and text above.
          required: true
        - label: I understand that any paid work requires a written scope and price before coding begins.
          required: true
        - label: I accept async text only and at most one consolidated revision within the agreed scope.
          required: true
